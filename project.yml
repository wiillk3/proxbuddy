name: ProxBuddy

options:
  bundleIdPrefix: rfid.spot
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  ProxBuddy:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: rfid.spot.proxbuddy

    sources:
      - path: ProxBuddy
        excludes:
          - "Resources/pm3client"
          - "Resources/libpm3client.dylib"
          - "Resources/.gitkeep"
          - "Info.plist"
          - "ProxBuddy.entitlements"
          - "AI"
          - "Resources/luascripts"
          - "Resources/pyscripts"
          - "Resources/cmdscripts"
          - "Resources/lualibs"
          - "Resources/dictionaries"
          - "Python.xcframework"
          - "Resources/python311.zip"
          - "Resources/python313.zip"
          - "Resources/tools"
        type: group
      - path: ProxBuddy/Resources/luascripts
        type: folder
      - path: ProxBuddy/Resources/pyscripts
        type: folder
      - path: ProxBuddy/Resources/cmdscripts
        type: folder
      - path: ProxBuddy/Resources/lualibs
        type: folder
      - path: ProxBuddy/Resources/dictionaries
        type: folder

    # BeeWare's XCFramework is only the libPython dylib. Stdlib + lib-dynload
    # must be copied into the .app (and .so files rewritten as frameworks)
    # before embed/sign. See Python.xcframework/build/utils.sh.
    postCompileScripts:
      - name: Install Python stdlib
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          bash "$PROJECT_DIR/scripts/install_python_ios.sh"

    info:
      path: ProxBuddy/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: White
        NSLocalNetworkUsageDescription: "ProxBuddy uses the local network to connect to your Proxmark5 over Wi-Fi (STA + TCP)."
        NSBluetoothAlwaysUsageDescription: "ProxBuddy uses Bluetooth to scan for and connect directly to your Proxmark5 device."
        NSBluetoothPeripheralUsageDescription: "ProxBuddy uses Bluetooth to scan for and connect directly to your Proxmark5 device."
        NSLocationWhenInUseUsageDescription: "ProxBuddy uses your location to optionally tag RFID/NFC card dumps with GPS coordinates for spatial analysis."
        UIBackgroundModes:
          - bluetooth-central

    entitlements:
      path: ProxBuddy/ProxBuddy.entitlements

    settings:
      DEVELOPMENT_TEAM: ""            # fill in your Team ID
      CODE_SIGN_IDENTITY: "iPhone Developer"
      PROVISIONING_PROFILE_SPECIFIER: ""
      PRODUCT_BUNDLE_IDENTIFIER: rfid.spot.proxbuddy
      INFOPLIST_FILE: ProxBuddy/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    dependencies:
      - framework: ProxBuddy/Resources/libpm3client.dylib
        embed: true
        link: false
      - framework: ProxBuddy/Python.xcframework
        embed: true
        link: true
      - framework: ProxBuddy/Resources/tools/libstaticnested_0nt.dylib
        embed: true
        link: false
      - framework: ProxBuddy/Resources/tools/libstaticnested_1nt.dylib
        embed: true
        link: false
      - framework: ProxBuddy/Resources/tools/libstaticnested_2nt.dylib
        embed: true
        link: false
      - framework: ProxBuddy/Resources/tools/libstaticnested_2x1nt_rf08s.dylib
        embed: true
        link: false
      - framework: ProxBuddy/Resources/tools/libstaticnested_2x1nt_rf08s_1key.dylib
        embed: true
        link: false
      - framework: ProxBuddy/Resources/tools/libmfulc_des_brute.dylib
        embed: true
        link: false

  ProxBuddyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ProxBuddyTests
    dependencies:
      - target: ProxBuddy
    settings:
      SWIFT_VERSION: "6.0"
      SWIFT_STRICT_CONCURRENCY: complete
      PRODUCT_BUNDLE_IDENTIFIER: rfid.spot.proxbuddy.tests
